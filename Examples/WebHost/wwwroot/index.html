<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharpConsoleUI in a browser</title>
<style>
  :root { --bg: #0b0e16; --fg: #c8d0e0; --dim: #6c7793; --accent: #78c8ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header { padding: 12px 16px; border-bottom: 1px solid #1d2435; display: flex;
           align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; color: var(--accent); }
  .note { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: flex; justify-content: center; align-items: flex-start;
         padding: 16px; }
  /* 1:1 pixels. Scaling the canvas would break pixel-to-cell arithmetic. */
  #screen { image-rendering: pixelated; cursor: default; outline: none;
            border: 1px solid #1d2435; max-width: 100%; }
  footer { padding: 8px 16px; border-top: 1px solid #1d2435; color: var(--dim);
           font-size: 12px; display: flex; gap: 20px; flex-wrap: wrap; }
  .err { color: #ff8080; }
</style>
</head>
<body>
<header>
  <h1>SharpConsoleUI &mdash; headless, in a browser</h1>
  <span class="note">
    No terminal. Rendered to PNG, driven over the diagnostics socket. Click and type.
  </span>
</header>

<main>
  <!-- tabindex makes the canvas focusable so it can receive keydown -->
  <canvas id="screen" tabindex="0" width="960" height="576"></canvas>
</main>

<footer>
  <span id="status">connecting&hellip;</span>
  <span id="frameInfo"></span>
  <span id="fpsInfo"></span>
  <span class="note">Esc, Tab, arrows and text all go through the real input path.</span>
</footer>

<script>
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const frameEl = document.getElementById('frameInfo');
const fpsEl = document.getElementById('fpsInfo');

let lastFrame = 0;       // highest frame the server has sent us
let cellW = 8, cellH = 16;
let polling = false;
let drawn = 0, drawnSince = performance.now();

// --- Frames ---------------------------------------------------------------

async function poll() {
  if (polling) return;          // never overlap: a slow frame must not queue
  polling = true;
  try {
    const res = await fetch(`/frame?since=${lastFrame}`);
    if (!res.ok) { fail(`server returned ${res.status}`); return; }

    const body = await res.json();
    if (body.error) { fail(body.error); return; }

    // Nothing new: what is already on the canvas is still correct.
    if (body.unchanged) { ok(); return; }

    const [w, h] = body.cell.split('x').map(Number);
    cellW = w; cellH = h;
    lastFrame = body.frame;

    await draw(body);
    ok();
  } catch (e) {
    fail(e.message);
  } finally {
    polling = false;
  }
}

function draw(body) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      if (canvas.width !== body.width || canvas.height !== body.height) {
        canvas.width = body.width;
        canvas.height = body.height;
      }
      ctx.drawImage(img, 0, 0);
      frameEl.textContent =
        `frame ${body.frame} · ${body.cols}×${body.rows} cells · ${body.cell}px`;
      countFrame();
      resolve();
    };
    img.onerror = () => resolve();
    img.src = 'data:image/png;base64,' + body.png;
  });
}

function countFrame() {
  drawn++;
  const elapsed = performance.now() - drawnSince;
  if (elapsed >= 1000) {
    fpsEl.textContent = `${(drawn * 1000 / elapsed).toFixed(1)} fps drawn`;
    drawn = 0;
    drawnSince = performance.now();
  }
}

function ok() { statusEl.textContent = 'connected'; statusEl.className = ''; }
function fail(msg) { statusEl.textContent = msg; statusEl.className = 'err'; }

// --- Input ----------------------------------------------------------------

async function send(message) {
  try {
    await fetch('/input', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(message),
    });
    poll();                     // the screen almost certainly changed
  } catch (e) {
    fail(e.message);
  }
}

// Pixel to cell. The canvas may be displayed smaller than its natural size on
// a narrow window, so divide by the displayed-to-natural ratio first or every
// click lands in the wrong place.
function cellAt(event) {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  return {
    x: Math.floor((event.clientX - r.left) * scaleX / cellW),
    y: Math.floor((event.clientY - r.top) * scaleY / cellH),
  };
}

canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  canvas.focus();
  const { x, y } = cellAt(e);
  const button = e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left';
  send({ kind: 'mouse', x, y, action: 'click', button });
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const { x, y } = cellAt(e);
  send({ kind: 'mouse', x, y, action: e.deltaY < 0 ? 'wheelup' : 'wheeldown' });
}, { passive: false });

// Browser key names to the tmux notation the socket speaks.
const NAMED = {
  ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right',
  Enter: 'Enter', Escape: 'Escape', Tab: 'Tab', Backspace: 'Backspace',
  Delete: 'Delete', Home: 'Home', End: 'End', PageUp: 'PageUp', PageDown: 'PageDown',
  ' ': 'Space',
};

canvas.addEventListener('keydown', e => {
  let spec = NAMED[e.key] ?? (/^F\d{1,2}$/.test(e.key) ? e.key : null);

  if (!spec && e.key.length === 1) {
    // A quoted string is typed literally, one keystroke per character.
    spec = e.ctrlKey || e.altKey ? e.key : JSON.stringify(e.key);
  }

  if (!spec) return;            // a modifier on its own, or a key we do not map

  // Order does not matter to the parser, but keep it stable for readability.
  if (e.shiftKey && NAMED[e.key]) spec = 'S-' + spec;
  if (e.altKey) spec = 'M-' + spec;
  if (e.ctrlKey) spec = 'C-' + spec;

  e.preventDefault();
  send({ kind: 'key', spec });
});

// --- Loop -----------------------------------------------------------------

canvas.focus();
poll();
setInterval(poll, 100);         // 10fps ceiling; unchanged frames cost ~29 bytes
</script>
</body>
</html>
