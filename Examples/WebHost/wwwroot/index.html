<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharpConsoleUI in a browser</title>
<!-- Inline, so the page does not ask for a favicon that is not there. -->
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;rect width='16' height='16' fill='%230b0e16'/&gt;&lt;text y='12' x='2' font-size='11' fill='%2378c8ff'&gt;&gt;_&lt;/text&gt;&lt;/svg&gt;">
<style>
  :root { --bg: #0b0e16; --fg: #c8d0e0; --dim: #6c7793; --accent: #78c8ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header { padding: 12px 16px; border-bottom: 1px solid #1d2435; display: flex;
           align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; color: var(--accent); }
  .note { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: flex; justify-content: center; align-items: flex-start;
         padding: 16px; }
  /* 1:1 pixels. Scaling the canvas would break pixel-to-cell arithmetic. */
  #screen { image-rendering: pixelated; cursor: default; outline: none;
            border: 1px solid #1d2435; max-width: 100%; }
  footer { padding: 8px 16px; border-top: 1px solid #1d2435; color: var(--dim);
           font-size: 12px; display: flex; gap: 20px; flex-wrap: wrap; }
  .err { color: #ff8080; }
</style>
</head>
<body>
<header>
  <h1>SharpConsoleUI &mdash; headless, in a browser</h1>
  <span class="note">
    No terminal. Rendered to PNG, driven over the diagnostics socket. Click and type.
  </span>
</header>

<main>
  <!-- tabindex makes the canvas focusable so it can receive keydown -->
  <canvas id="screen" tabindex="0" width="960" height="576"></canvas>
</main>

<footer>
  <span id="status">connecting&hellip;</span>
  <span id="frameInfo"></span>
  <span id="fpsInfo"></span>
  <span class="note">Esc, Tab, arrows and text all go through the real input path.</span>
</footer>

<script>
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const frameEl = document.getElementById('frameInfo');
const fpsEl = document.getElementById('fpsInfo');

let lastFrame = 0;       // highest frame the server has sent us
let cellW = 8, cellH = 16;
let polling = false;
let drawn = 0, drawnSince = performance.now();

// --- Frames ---------------------------------------------------------------

async function poll() {
  if (polling) return;          // never overlap: a slow frame must not queue
  polling = true;
  try {
    const res = await fetch(`/frame?since=${lastFrame}`);
    if (!res.ok) { fail(`server returned ${res.status}`); return; }

    const body = await res.json();
    if (body.error) { fail(body.error); return; }

    // Nothing new: what is already on the canvas is still correct.
    if (body.unchanged) { ok(); return; }

    const [w, h] = body.cell.split('x').map(Number);
    cellW = w; cellH = h;
    lastFrame = body.frame;

    await draw(body);
    ok();
  } catch (e) {
    fail(e.message);
  } finally {
    polling = false;
  }
}

function draw(body) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      if (canvas.width !== body.width || canvas.height !== body.height) {
        canvas.width = body.width;
        canvas.height = body.height;
      }
      ctx.drawImage(img, 0, 0);
      frameEl.textContent =
        `frame ${body.frame} · ${body.cols}×${body.rows} cells · ${body.cell}px`;
      countFrame();
      resolve();
    };
    img.onerror = () => resolve();
    img.src = 'data:image/png;base64,' + body.png;
  });
}

function countFrame() {
  drawn++;
  const elapsed = performance.now() - drawnSince;
  if (elapsed >= 1000) {
    fpsEl.textContent = `${(drawn * 1000 / elapsed).toFixed(1)} fps drawn`;
    drawn = 0;
    drawnSince = performance.now();
  }
}

function ok() { statusEl.textContent = 'connected'; statusEl.className = ''; }
function fail(msg) { statusEl.textContent = msg; statusEl.className = 'err'; }

// --- Input ----------------------------------------------------------------

async function send(message) {
  try {
    await fetch('/input', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(message),
    });
    poll();                     // the screen almost certainly changed
  } catch (e) {
    fail(e.message);
  }
}

// Pixel to cell. The canvas may be displayed smaller than its natural size on
// a narrow window, so divide by the displayed-to-natural ratio first or every
// click lands in the wrong place.
function cellAt(event) {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  return {
    x: Math.floor((event.clientX - r.left) * scaleX / cellW),
    y: Math.floor((event.clientY - r.top) * scaleY / cellH),
  };
}

// A gesture is press, then moves, then release - and, if the pointer never
// left the cell it started in, a "click" as well. "Clicked" is its own flag in
// the library, not a press plus a release, so a control listening for it never
// fires unless that final event is sent.
let dragging = null;     // the button held down, or null
let lastCell = null;     // last cell reported, so a move inside one cell is not resent
let startCell = null;    // where the press landed, to tell a click from a drag
let moved = false;       // whether the pointer left the starting cell

function buttonName(e) {
  return e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left';
}

canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  canvas.focus();
  const { x, y } = cellAt(e);
  dragging = buttonName(e);
  lastCell = startCell = `${x},${y}`;
  moved = false;
  send({ kind: 'mouse', x, y, action: 'press', button: dragging });
});

// On window, not canvas: a drag that leaves the canvas must keep reporting,
// and a release outside it must still end the drag rather than leaving the
// application convinced the button is still down.
window.addEventListener('mousemove', e => {
  const { x, y } = cellAt(e);
  const cell = `${x},${y}`;

  // One event per cell crossed. At 8x16 pixels a slow drag would otherwise
  // send dozens of identical positions and starve the frame polling.
  if (cell === lastCell) return;
  lastCell = cell;

  if (dragging) {
    if (cell !== startCell) moved = true;
    send({ kind: 'mouse', x, y, action: 'move', button: dragging });
  }
});

window.addEventListener('mouseup', e => {
  if (!dragging) return;
  const { x, y } = cellAt(e);
  const button = dragging;
  const wasDrag = moved;
  dragging = null;
  lastCell = startCell = null;
  moved = false;

  // Release and click in ONE event when the pointer never left the cell, because
  // that is what a terminal reports. Sent as two messages instead, the click lands
  // after a dropdown has opened its portal and closes it again - portals intercept
  // Clicked before windows, so the control opens and shuts within a frame.
  send({ kind: 'mouse', x, y, action: wasDrag ? 'release' : 'releaseclick', button });
});

// The browser fires dblclick AFTER the second full press/release/click pair,
// which is also the order a terminal reports it: Clicked first, then
// DoubleClicked. Controls rely on that - CheckboxControl toggles on Clicked
// and deliberately does not toggle again on DoubleClicked - so this must not
// be reordered or de-duplicated.
canvas.addEventListener('dblclick', e => {
  e.preventDefault();
  const { x, y } = cellAt(e);
  send({ kind: 'mouse', x, y, action: 'doubleclick', button: buttonName(e) });
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const { x, y } = cellAt(e);
  send({ kind: 'mouse', x, y, action: e.deltaY < 0 ? 'wheelup' : 'wheeldown' });
}, { passive: false });

// Browser key names to the tmux notation the socket speaks.
const NAMED = {
  ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right',
  Enter: 'Enter', Escape: 'Escape', Tab: 'Tab', Backspace: 'Backspace',
  Delete: 'Delete', Home: 'Home', End: 'End', PageUp: 'PageUp', PageDown: 'PageDown',
  ' ': 'Space',
};

canvas.addEventListener('keydown', e => {
  let spec = NAMED[e.key] ?? (/^F\d{1,2}$/.test(e.key) ? e.key : null);

  if (!spec && e.key.length === 1) {
    // A quoted string is typed literally, one keystroke per character.
    spec = e.ctrlKey || e.altKey ? e.key : JSON.stringify(e.key);
  }

  if (!spec) return;            // a modifier on its own, or a key we do not map

  // Order does not matter to the parser, but keep it stable for readability.
  if (e.shiftKey && NAMED[e.key]) spec = 'S-' + spec;
  if (e.altKey) spec = 'M-' + spec;
  if (e.ctrlKey) spec = 'C-' + spec;

  e.preventDefault();
  send({ kind: 'key', spec });
});

// --- Resize ---------------------------------------------------------------
// Tell the application how many cells now fit, so it re-lays out instead of
// being letterboxed. Only a headless driver can be resized like this - a real
// terminal owns its own size.

let resizeTimer = null;
let lastSize = null;

function fitToWindow() {
  const style = getComputedStyle(canvas);
  const availW = canvas.parentElement.clientWidth
    - parseFloat(style.borderLeftWidth) - parseFloat(style.borderRightWidth);
  const availH = window.innerHeight - canvas.getBoundingClientRect().top - 24;

  // Guard the arithmetic: a hidden or zero-width layout would ask for a
  // zero-cell screen, which the socket rejects.
  const cols = Math.max(20, Math.floor(availW / cellW));
  const rows = Math.max(10, Math.floor(availH / cellH));
  const size = `${cols}x${rows}`;

  if (size === lastSize) return;
  lastSize = size;
  send({ kind: 'resize', x: cols, y: rows });
}

window.addEventListener('resize', () => {
  // Debounced: a drag of the window edge fires continuously, and each resize
  // rebuilds the application's console buffer.
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(fitToWindow, 150);
});

// --- Loop -----------------------------------------------------------------

canvas.focus();
poll().then(fitToWindow);       // cell size is known only after the first frame
setInterval(poll, 100);         // 10fps ceiling; unchanged frames cost ~29 bytes
</script>
</body>
</html>
